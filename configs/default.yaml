# Default configuration for SawitGuard-GNN scripts. Values here are the
# defaults baked into scripts/*.py; override via the env vars noted below
# (see src/oil_palm/config.py for how DATA_ROOT resolves).

huggingface:
  # ------------------------------------------------------------------ NAMESPACE
  # These two ids are the ONLY place the Hugging Face account name appears.
  # Account: `Tapziy`. If that ever changes, edit these two lines and nowhere
  # else. (Note: the GitHub account is a DIFFERENT name, `qibas` — the two are
  # not interchangeable.)
  #
  # Until the repos exist, everything still works offline via:
  #   python scripts/download_assets.py --from-local ../oil-palm-detection-model-data --full
  model_repo: "Tapziy/oil-palm-detection-weights"
  dataset_repo: "Tapziy/oil-palm-detection-data"

paths:
  # Override with env var SAWITGUARD_DATA_ROOT instead of editing this file —
  # see src/oil_palm/config.py.
  data_root: "data_clean"

demo:
  host: "127.0.0.1"
  port: 8000
